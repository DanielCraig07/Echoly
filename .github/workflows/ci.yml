name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, Lint & Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      # 放在 lint 前：格式问题一眼就能看出「跑 npm run format 就好」，
      # 而 lint 的报错要看上下文。顺序反了会让人先读一堆 lint 提示再发现有格式问题。
      - name: Prettier Format Check
        run: npm run format:check

      - name: ESLint Code Inspection
        run: npm run lint

      - name: Automated Unit Tests
        run: npm test

      - name: Build Verification
        run: npm run build
