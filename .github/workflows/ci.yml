name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, Lint & Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      # 放在 lint 前：格式问题一眼就能看出「跑 npm run format 就好」，
      # 而 lint 的报错要看上下文。顺序反了会让人先读一堆 lint 提示再发现有格式问题。
      - name: Prettier Format Check
        run: npm run format:check

      - name: ESLint Code Inspection
        run: npm run lint

      # 「功能实现了、但界面上没有入口」这类问题，typecheck / lint / test / build 一条都拦不住
      # （「没人调用」不是错误）。扩展市场和 AI 任务看板都这样瞒过过整轮检查，
      # 所以把接线本身也做成门禁。
      - name: UI Wiring Audit
        run: npm run audit:wiring

      - name: Automated Unit Tests
        run: npm test

      - name: Build Verification
        run: npm run build
