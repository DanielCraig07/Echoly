name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Sync version from git tag
        run: node scripts/sync-version.js ${{ github.ref_name }}

      - name: Quality gate
        continue-on-error: true
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Package macOS arm64 DMG (publish to release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! npm run pack:mac:publish; then
            echo "::warning::pack:mac:publish encountered upload error, executing fallback gh release upload..."
            cd apps/desktop
            gh release upload "${{ github.ref_name }}" release/*.dmg release/*.dmg.blockmap release/latest-mac.yml --clobber || true
          fi


  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Sync version from git tag
        run: node scripts/sync-version.js ${{ github.ref_name }}

      - name: Package Windows x64 NSIS (publish to release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! npm run pack:win:publish; then
            echo "::warning::pack:win:publish encountered upload error, executing fallback gh release upload..."
            cd apps/desktop
            gh release upload "${{ github.ref_name }}" release/*.exe release/*.exe.blockmap release/latest.yml --clobber || true
          fi


  publish:
    needs: [macos, windows]
    if: always() && !cancelled() && (needs.macos.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Publishing draft release for tag: $TAG..."
          # 查找当前 tag 关联的 draft release 并取消 draft 状态
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n 1)
          if [ -n "$RELEASE_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -f draft=false
            echo "✓ Release $TAG (ID: $RELEASE_ID) published successfully!"
          else
            # 备选方案：尝试直接编辑 tag 对应的 release 或创建 release
            gh release edit "$TAG" --draft=false 2>/dev/null || gh release create "$TAG" --title "$TAG" --generate-notes || true
          fi
