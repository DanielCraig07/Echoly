name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Sync version from git tag
        run: node scripts/sync-version.js ${{ github.ref_name }}

      - name: Quality gate
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Package macOS arm64 DMG (publish to release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run pack:mac:publish


  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Sync version from git tag
        run: node scripts/sync-version.js ${{ github.ref_name }}

      - name: Package Windows x64 NSIS (publish to release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run pack:win:publish


  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Publishing draft release for tag: $TAG..."
          # 查找当前 tag 关联的 draft release 并取消 draft 状态
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n 1)
          if [ -n "$RELEASE_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -f draft=false
            echo "✓ Release $TAG (ID: $RELEASE_ID) published successfully!"
          else
            # 备选方案：尝试直接编辑 tag 对应的 release
            gh release edit "$TAG" --draft=false || echo "Warning: Could not automatically publish release for $TAG"
          fi
